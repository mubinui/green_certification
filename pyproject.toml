[project]
name = "green-certification"
version = "0.1.0"
description = "Green Duty API - Tree analysis and certification system"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.21.1", 
    "python-multipart>=0.0.6",
    "pydantic>=1.10.7",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.9",
    "alembic>=1.10.3",
    "psycopg2-binary>=2.9.6",
    "geoalchemy2>=0.13.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.2",
    "requests>=2.28.2",
    "loguru>=0.6.0",
    "pillow>=9.5.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.3",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.2.2",
    "pytest>=7.3.1",
    "httpx>=0.24.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

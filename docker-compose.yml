version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/green_duty
      - DEBUG=true
      - GEMMA_API_KEY=${GEMMA_API_KEY}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:14
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=green_duty
    restart: unless-stopped

volumes:
  postgres_data:
version: '3.8'

services:
  # PostgreSQL Database with PostGIS extension
  db:
    image: postgis/postgis:14-3.2
    container_name: green_cert_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=green_certification
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Ollama service for Gemma model
  ollama:
    image: ollama/ollama:latest
    container_name: green_cert_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # FastAPI Application
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: green_cert_api
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./test_images:/app/test_images
      - .:/app
    environment:
      # Database Configuration
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/green_certification
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=green_certification
      
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=true
      - API_PREFIX=/api/v1
      
      # Ollama/Gemma Configuration
      - OLLAMA_BASE_URL=http://ollama:11434
      - GEMMA_MODEL_NAME=gemma3n:latest
      
      # Security
      - SECRET_KEY=your-secret-key-change-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      
      # Application Settings
      - PYTHONPATH=/app
      - MAX_IMAGE_SIZE=10485760
      - ALLOWED_IMAGE_TYPES=image/jpeg,image/png,image/jpg
      
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for services to be ready...' &&
        sleep 10 &&
        echo 'Running database migrations...' &&
        alembic upgrade head &&
        echo 'Starting FastAPI server...' &&
        python main.py
      "

  # Model Initialization Service (downloads Gemma model)
  model-init:
    image: ollama/ollama:latest
    container_name: green_cert_model_init
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Pulling Gemma3n model...' &&
        ollama pull gemma3n:latest &&
        echo 'Model ready!'
      "
    restart: "no"

  # Redis for caching (optional but recommended for production)
  redis:
    image: redis:7-alpine
    container_name: green_cert_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Nginx reverse proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: green_cert_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local  
  redis_data:
    driver: local